<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InkSight — AI Handwriting Evaluator</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">
  <header class="text-center mb-6">
    <h1 class="text-3xl font-bold text-indigo-400">InkSight</h1>
    <p class="text-slate-400 text-sm">Draw or write below for instant AI evaluation</p>
  </header>

  <main class="w-full max-w-2xl bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700">
    <div class="flex justify-between items-center mb-4">
      <div class="space-x-2">
        <label for="brushSize" class="text-xs text-slate-300">Stroke:</label>
        <input type="range" id="brushSize" min="2" max="15" value="4" class="accent-indigo-500">
      </div>
      <button id="clearBtn" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm transition">Clear Canvas</button>
    </div>

    <canvas id="paintCanvas" class="w-full h-64 rounded-lg cursor-crosshair touch-none mb-4"></canvas>

    <button id="evalBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg shadow-md transition">
      Evaluate Handwriting
    </button>

    <!-- Results Display -->
    <div id="results" class="mt-6 hidden border-t border-slate-700 pt-4 space-y-3">
      <h2 class="text-lg font-semibold text-slate-200">AI Analysis</h2>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-slate-900 p-3 rounded">
          <span class="text-xs text-slate-400">Recognized Text</span>
          <p id="textOutput" class="text-lg font-bold text-indigo-300">—</p>
        </div>
        <div class="bg-slate-900 p-3 rounded">
          <span class="text-xs text-slate-400">Legibility Score</span>
          <p id="scoreOutput" class="text-lg font-bold text-emerald-400">—</p>
        </div>
      </div>
      <div class="bg-slate-900 p-3 rounded">
        <span class="text-xs text-slate-400">Feedback</span>
        <p id="feedbackOutput" class="text-sm text-slate-300 mt-1">—</p>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function initCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    initCanvas();

    function startDraw(e) { drawing = true; draw(e); }
    function stopDraw() { drawing = false; ctx.beginPath(); }
    function draw(e) {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      ctx.lineWidth = document.getElementById('brushSize').value;
      ctx.strokeStyle = '#000000';
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchend', stopDraw);
    canvas.addEventListener('touchmove', draw);

    document.getElementById('clearBtn').addEventListener('click', () => {
      initCanvas();
      document.getElementById('results').classList.add('hidden');
    });

    document.getElementById('evalBtn').addEventListener('click', async () => {
      const imageData = canvas.toDataURL('image/png');
      document.getElementById('evalBtn').innerText = 'Analyzing...';

      try {
        const res = await fetch('http://localhost:8000/api/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.detail || 'Backend process failed');
        }

        const data = await res.json();

        document.getElementById('textOutput').innerText = data.text;
        document.getElementById('scoreOutput').innerText = `${data.score} / 100`;
        document.getElementById('feedbackOutput').innerText = data.feedback;
        document.getElementById('results').classList.remove('hidden');
      } catch (err) {
        alert(`Error: ${err.message}\nEnsure backend is running at http://localhost:8000`);
      } finally {
        document.getElementById('evalBtn').innerText = 'Evaluate Handwriting';
      }
    });
  </script>
</body>
</html>
